small,.sub{color:var(--sub);font-size:13px}

button{font-size:16px;cursor:pointer}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--gr);color:#fff;font-weight:600;margin-top:8px}
.btn2{padding:8px 12px;border:0;border-radius:10px;background:var(--bg);color:var(--txt);font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:0 0 130px}
.big{font-size:28px;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:3px 0 8px}
.bar i{display:block;height:100%;border-radius:5px}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);gap:8px}
.item:first-of-type{border-top:0}
.del{background:none;border:0;color:var(--red);font-size:20px;padding:0 4px}
.sug{padding:11px 4px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.sug b{font-weight:600}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0}
.macros div{background:var(--bg);border-radius:12px;padding:8px 2px}
.macros b{display:block;font-size:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 0 10px;font-size:11px;color:var(--sub)}
nav button span{display:block;font-size:22px}
nav button.a{color:var(--gr);font-weight:600}
.glass{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.glass span{font-size:24px;opacity:.25}.glass span.on{opacity:1}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.chk input{width:22px;height:22px;margin:0}
.done{text-decoration:line-through;color:var(--sub)}
.days{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:8px}
.days div{flex:1;text-align:center;font-size:11px;color:var(--sub)}
.days i{display:block;border-radius:6px 6px 0 0;margin-bottom:4px}
details summary{color:var(--gr);font-weight:600;margin-top:6px}
.warn{color:var(--red);font-weight:600}

/* Suche */
const N=s=>String(s).toLowerCase().replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss").replace(/[ş]/g,"s").replace(/[ç]/g,"c").replace(/[ğ]/g,"g").replace(/[ı]/g,"i").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function stamm(w){return w.length>4?w.replace(/(en|er|e|n|s)$/,""):w}
function suche(q){
  const t=N(q).split(" ").filter(Boolean);if(!t.length)return[];
  const r=[];
  alle().forEach((f,idx)=>{
    const n=N(f[0]),h=n+" "+N(f[7]||""),w0=n.split(" ")[0];
    if(t.every(w=>h.includes(w)||h.includes(stamm(w)))){
      let sc=0;if(n===t.join(" "))sc+=100;if(n.startsWith(t[0]))sc+=40;if(n.split(" ").includes(t[0]))sc+=20;
      if(w0.length>1&&t[0].startsWith(w0)&&t[0].length-w0.length<=3)sc+=45;sc-=n.length/20+idx/15;
      r.push([sc,f]);
    }
  });
  return r.sort((a,b)=>b[0]-a[0]).slice(0,8).map(x=>x[1]);
}
function parse(q){
  const m=q.trim().match(/^(\d+(?:[.,]\d+)?)\s*(g|gr|gramm|ml|x|stk|stück|stueck|portionen|portion|scheiben|scheibe)?\.?\s+(.+)$/i);
  if(m)return{n:parseFloat(m[1].replace(",",".")),u:/^(g|gr|gramm|ml)$/i.test(m[2]||"")?"g":"p",text:m[3]};
  return{n:null,u:"p",text:q};
}

  const t=T(),s=sum(t.e),z=S.ziel,rest=z.k-s.k,pc=Math.min(s.k/z.k,1),C=339.3,over=rest<0;
  const bar=(l,v,g,c)=>`<div class="row"><span>${l}</span><span style="text-align:right">${r0(v)} / ${g} g</span></div><div class="bar"><i style="width:${Math.min(v/g*100,100)}%;background:${c}"></i></div>`;
  let h=`<div class="card ring"><svg viewBox="0 0 130 130"><circle cx="65" cy="65" r="54" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="65" cy="65" r="54" fill="none" stroke="${over?"var(--red)":"var(--gr)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc)}" transform="rotate(-90 65 65)"/><text x="65" y="62" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">${r0(Math.abs(rest))}</text><text x="65" y="82" text-anchor="middle" font-size="11" fill="var(--sub)">${over?"kcal zu viel":"kcal übrig"}</text></svg>
  <div><div class="sub">Gegessen</div><div class="big">${r0(s.k)}</div><div class="sub">Ziel: ${z.k} kcal</div>${over?'<div class="warn">Ziel überschritten!</div>':""}</div></div>
  <div class="card">${bar("Eiweiß",s.p,z.p,"var(--p)")}${bar("Kohlenhydrate",s.kh,z.kh,"var(--kh)")}${bar("Fett",s.f,z.f,"var(--f)")}</div>`;
  MZ.forEach(m=>{
    const e=t.e.map((x,i)=>[x,i]).filter(([x])=>x.m===m),ss=sum(e.map(a=>a[0]));
    h+=`<div class="card"><div class="row"><h2>${m}</h2><span style="text-align:right" class="sub">${r0(ss.k)} kcal</span></div>`;
    e.forEach(([x,i])=>h+=`<div class="item"><div><b>${esc(x.n)}</b><br><small>${esc(x.l)} · E ${r1(x.p)} · KH ${r1(x.kh)} · F ${r1(x.f)}</small></div><div class="row" style="flex:0 0 auto"><span>${r0(x.k)}</span><button class="del" onclick="del(${i})">×</button></div></div>`);
    h+=`<button class="btn2" style="margin-top:6px" onclick="addMz='${m}';zeig('add')">+ Essen hinzufügen</button></div>`;
  });
  let g="";for(let i=0;i<Math.max(z.w,t.w);i++)g+=`<span class="${i<t.w?"on":""}">💧</span>`;
  h+=`<div class="card"><div class="row"><h2>Wasser</h2><span style="text-align:right" class="sub">${t.w} von ${z.w} Gläsern (je 250 ml)</span></div><div class="glass">${g}</div><div class="row"><button class="btn2" onclick="wasser(-1)">− Glas</button><button class="btn2" onclick="wasser(1)">+ Glas</button></div></div>`;
  return h;
},
add(){
  const m=addMz||stdMz();
  let h=`<div class="card"><h2>Was hast du gegessen?</h2>
  <select id="mz">${MZ.map(x=>`<option${x===m?" selected":""}>${x}</option>`).join("")}</select>
  <input id="q" placeholder="z. B. Pizza, 2 Eier, 200 g Reis" autocomplete="off" value="${esc(letzteSuche)}" oninput="tippe()">
  <div id="sug"></div></div><div id="det"></div>`;
  return h;
},
rezepte(){
  return `<div class="card"><small>Alle Rezepte sind Halal. Werte pro Portion.</small></div>`+REZ.map((r,i)=>{
    const s=sum(r.z.map(([n,g])=>werte(find(n),g)));
    return `<div class="card"><h2>${r.n}</h2><div class="macros"><div><b>${r0(s.k)}</b><small>kcal</small></div><div><b>${r0(s.p)}</b><small>Eiweiß</small></div><div><b>${r0(s.kh)}</b><small>KH</small></div><div><b>${r0(s.f)}</b><small>Fett</small></div></div>
    <small>${r.z.map(([n,g])=>`${n} (${g} g)`).join(" · ")}</small>
    <details><summary>Zubereitung</summary><p>${r.s}</p></details>
    <div class="row" style="margin-top:8px"><button class="btn2" onclick="rezEss(${i})">✓ Gegessen</button><button class="btn2" onclick="rezKauf(${i})">🛒 Einkaufsliste</button></div></div>`;
  }).join("");
},
einkauf(){
  let h=`<div class="card"><h2>Einkaufsliste</h2><div class="row"><input id="ek" placeholder="Artikel hinzufügen"><button class="btn2" style="flex:0 0 auto" onclick="if(ek.value.trim()){S.einkauf.push({n:ek.value.trim(),ok:false});save();zeig('einkauf')}">+</button></div>`;
  if(!S.einkauf.length)h+=`<p class="sub">Noch leer. Bei den Rezepten auf „Einkaufsliste“ tippen.</p>`;
  S.einkauf.forEach((x,i)=>h+=`<label class="chk"><input type="checkbox"${x.ok?" checked":""} onchange="S.einkauf[${i}].ok=this.checked;save();zeig('einkauf')"><span class="${x.ok?"done":""}">${esc(x.n)}</span></label>`);
  if(S.einkauf.some(x=>x.ok))h+=`<button class="btn2" style="margin-top:8px" onclick="S.einkauf=S.einkauf.filter(x=>!x.ok);save();zeig('einkauf')">Erledigte löschen</button>`;
  return h+"</div>";
},
mehr(){
  const z=S.ziel;let tage=[],max=z.k;
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=iso(d),v=S.tage[k]?sum(S.tage[k].e).k:0;tage.push([d,v]);max=Math.max(max,v)}
  let h=`<div class="card"><h2>Letzte 7 Tage</h2><div class="days">${tage.map(([d,v])=>`<div><small>${r0(v)}</small><i style="height:${v/max*95}px;background:${v>z.k?"var(--red)":"var(--gr)"}"></i>${d.toLocaleDateString("de-DE",{weekday:"short"})}</div>`).join("")}</div></div>`;
  h+=`<div class="card"><h2>Gewicht</h2><div class="row"><input id="gw" type="number" step="0.1" inputmode="decimal" placeholder="kg"><button class="btn2" style="flex:0 0 auto" onclick="if(+gw.value){S.gewicht.push([heute(),+gw.value]);save();zeig('mehr')}">Speichern</button></div>`;
  S.gewicht.slice(-5).reverse().forEach(([d,w])=>h+=`<div class="item"><span>${fmtD(d)}</span><b style="text-align:right">${w} kg</b></div>`);
  h+=`</div><div class="card"><h2>Meine Ziele</h2>
  <small>Kalorien pro Tag</small><input id="zk" type="number" inputmode="numeric" value="${z.k}">
  <div class="row"><div><small>Eiweiß g</small><input id="zp" type="number" value="${z.p}"></div><div><small>KH g</small><input id="zh" type="number" value="${z.kh}"></div><div><small>Fett g</small><input id="zf" type="number" value="${z.f}"></div></div>
  <small>Wasser (Gläser à 250 ml)</small><input id="zw" type="number" value="${z.w}">
  <button class="btn" onclick="S.ziel={k:+zk.value||2000,p:+zp.value||0,kh:+zh.value||0,f:+zf.value||0,w:+zw.value||8};save();alert('Gespeichert')">Ziele speichern</button></div>`;
  h+=`<div class="card"><h2>Eigene Lebensmittel</h2><small>Werte von der Verpackung (pro 100 g) eintragen. Sie erscheinen dann bei der Suche.</small>${eigenesForm("")}`;
  S.eigene.forEach((f,i)=>h+=`<div class="item"><div><b>${esc(f[0])}</b><br><small>${f[1]} kcal / 100 g</small></div><button class="del" onclick="S.eigene.splice(${i},1);save();zeig('mehr')">×</button></div>`);
  h+=`</div><div class="card"><small>Die Nährwerte sind Durchschnittswerte. Bei Fertigprodukten sind die Angaben auf der Verpackung genauer. Deine Daten bleiben nur auf diesem Gerät.</small></div>`;
  return h;
}
};

function eigenesForm(name){
  return `<input id="en" placeholder="Name" value="${esc(name)}"><div class="row"><input id="ekc" type="number" inputmode="decimal" placeholder="kcal"><input id="ep" type="number" inputmode="decimal" placeholder="Eiweiß g"></div><div class="row"><input id="eh" type="number" inputmode="decimal" placeholder="KH g"><input id="ef" type="number" inputmode="decimal" placeholder="Fett g"></div><input id="eg" type="number" inputmode="numeric" placeholder="Portion in g (z. B. 100)"><button class="btn" onclick="eigenesSpeichern()">Lebensmittel speichern</button>`;
}
function eigenesSpeichern(){
  const n=en.value.trim();if(!n||ekc.value===""){alert("Bitte mindestens Name und kcal eintragen");return}
  S.eigene.push([n,+ekc.value,+ep.value||0,+eh.value||0,+ef.value||0,+eg.value||100,"1 Portion",""]);save();
  if(tab==="add"){letzteSuche=n;zeig("add")}else{alert("Hinzugefügt");zeig("mehr")}
}

/* Eingabe */
function tippe(){
  letzteSuche=q.value;const p=parse(q.value),r=suche(p.text);sel=null;det.innerHTML="";
  if(!q.value.trim()){sug.innerHTML="";return}
  if(!r.length){sug.innerHTML=`<p class="sub">„${esc(p.text)}“ ist nicht in der Liste. Leg es mit den Werten von der Verpackung an:</p>${eigenesForm(p.text)}`;return}
  sug.innerHTML=r.map((f,i)=>`<div class="sug" onclick="waehle(${i})"><div><b>${esc(f[0])}</b><br><small>${esc(f[6])} (${f[5]} g)</small></div><div style="text-align:right"><b>${r0(f[1]*f[5]/100)}</b><br><small>kcal</small></div></div>`).join("");
  tippe.r=r;tippe.p=p;
}
function waehle(i){
  const f=tippe.r[i],p=tippe.p;sel={f,n:p.n||1,u:p.u};
  sug.innerHTML="";
  det.innerHTML=`<div class="card"><h2>${esc(f[0])}</h2><small>Pro 100 g: ${f[1]} kcal · E ${f[2]} g · KH ${f[3]} g · F ${f[4]} g</small>
  <div class="row" style="margin-top:8px"><input id="anz" type="number" inputmode="decimal" step="any" value="${sel.n}" oninput="rechne()"><select id="ein" onchange="umstellen()"><option value="p"${sel.u==="p"?" selected":""}>× ${esc(f[6])} (${f[5]} g)</option><option value="g"${sel.u==="g"?" selected":""}>Gramm</option></select></div>
  <div id="erg"></div><button class="btn" onclick="eintragen()">Eintragen</button></div>`;
  rechne();
}
function umstellen(){const a=+anz.value||0;anz.value=ein.value==="g"?r0(a*sel.f[5]):r1(a/sel.f[5]);rechne()}
function gramm(){const a=+String(anz.value).replace(",",".")||0;return ein.value==="g"?a:a*sel.f[5]}
function rechne(){
  const g=gramm(),w=werte(sel.f,g);
  erg.innerHTML=`<div class="macros"><div><b>${r0(w.k)}</b><small>kcal</small></div><div><b>${r1(w.p)}</b><small>Eiweiß</small></div><div><b>${r1(w.kh)}</b><small>KH</small></div><div><b>${r1(w.f)}</b><small>Fett</small></div></div><small>Menge: ${r0(g)} g</small>`;
}
function eintragen(){
  const g=gramm();if(!g){alert("Bitte eine Menge eingeben");return}
  const w=werte(sel.f,g),a=+anz.value;
  const l=ein.value==="g"?`${r0(g)} g`:`${a===1?sel.f[6]:a+" × "+sel.f[6].replace(/^1 /,"")} (${r0(g)} g)`;
  T().e.push({m:mz.value,n:sel.f[0],g,l,...w});save();
  sel=null;letzteSuche="";addMz=null;zeig("heute");
}
function del(i){T().e.splice(i,1);save();zeig("heute")}
function wasser(n){T().w=Math.max(0,T().w+n);save();zeig("heute")}
function rezEss(i){
  const r=REZ[i],s=sum(r.z.map(([n,g])=>werte(find(n),g))),g=r.z.reduce((a,x)=>a+x[1],0);
  const m=prompt("Welche Mahlzeit? (Frühstück, Mittagessen, Abendessen, Snacks)",stdMz());if(m===null)return;
  T(heute()).e.push({m:MZ.includes(m)?m:"Snacks",n:r.n,g,l:`1 Portion (${g} g)`,...s});save();D=heute();zeig("heute");
}
function rezKauf(i){REZ[i].z.forEach(([n,g])=>S.einkauf.push({n:`${n} (${g} g)`,ok:false}));save();alert("Zur Einkaufsliste hinzugefügt")}

function zeig(t){
  tab=t;
  const titel={heute:fmtD(D),add:"Essen eintragen",rezepte:"Halal-Rezepte",einkauf:"Einkauf",mehr:"Verlauf & Ziele"};
  document.getElementById("titel").textContent=titel[t];
  document.getElementById("dnav").innerHTML=t==="heute"?`<button onclick="tag(-1)">‹</button><button onclick="tag(1)">›</button>`:"";
  document.getElementById("v").innerHTML=V[t]();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("a",b.dataset.t===t));
  if(t==="add"){const q=document.getElementById("q");if(letzteSuche)tippe();else q.focus()}
  window.scrollTo(0,0);
}
function tag(n){const d=new Date(D+"T12:00");d.setDate(d.getDate()+n);const k=iso(d);if(k>heute())return;D=k;zeig("heute")}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{if(b.dataset.t==="heute")D=heute();if(b.dataset.t==="add")addMz=null;zeig(b.dataset.t)});
zeig("heute");
</script>
</body>
</html>
